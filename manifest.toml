packaging_format = 2

id = "hubzilla"
name = "Hubzilla"
description.en = "Decentralized publication platform and social network"
description.fr = "Plateforme de publication décentralisée et un réseau social"

version = "11.4.3~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://hubzilla.org"
code = "https://framagit.org/hubzilla/core"

[integration]
yunohost = ">= 12.1.40"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "200M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
    [resources.sources]
        [resources.sources.main]
        url = "https://framagit.org/hubzilla/core/-/archive/11.4.3/core-11.4.3.tar.bz2"
        sha256 = "a3a401e7be99410a3baf7e6f0ac576ed588a1783a1215613326ba1204ac04dec"
        autoupdate.strategy = "latest_gitlab_release"

        [resources.sources.addons]
        url = "https://framagit.org/hubzilla/addons/-/archive/11.4.3/addons-11.4.3.tar.bz2"
        sha256 = "33d9db0e23fa5437cb7f258cfd8c2a58c61413f94151672cd1e1e126b4ca829f"
        autoupdate.strategy = "latest_gitlab_tag"
        autoupdate.upstream = "https://framagit.org/hubzilla/addons"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql, php8.5-curl, php8.5-gd, php8.5-pgsql, php8.5-mbstring, php8.5-xml, php8.5-zip, php8.5-cli, php8.5-imagick, php8.5-gmp, php8.5-intl"

    [resources.database]
    type = "postgresql"
